[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Multi-Format RAG Document Chatbot for Acme Retail"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # LangChain core + integrations
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    # Document parsing
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "python-pptx>=1.0.0",
    # Observability
    "langfuse>=3.0.0",
    # Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Utilities
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-magic>=0.4.27",
]

[dependency-groups]
dev = [
    "ruff>=0.14.2",
    "pre-commit>=4.0.0",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
app = "rag_chatbot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_chatbot"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (type hints)
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
]
ignore = [
    "S101",    # Use of assert (acceptable in non-test code for invariants)
    "ANN401",  # Dynamically typed expressions (Any)
]

[tool.ruff.lint.per-file-ignores]
"src/rag_chatbot/db/models.py" = ["N815"]  # allow mixedCase column names from ORM

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["rag_chatbot"]
